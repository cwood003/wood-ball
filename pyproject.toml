[project]
name = "wood-ball"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cole", email = "cwood0107@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.9.1",
    "dbt-duckdb>=1.9.1",
    "duckdb>=1.1.3",
    "great-tables>=0.15.0",
    "matplotlib>=3.10.0",
    "nba-api>=1.6.1",
    "plotly>=5.24.1",
    "polars>=1.17.1",
    "pyarrow>=18.1.0",
    "rich>=13.9.4",
    "typer>=0.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
demo-app = "wood_ball.test_cli:app"

[dependency-groups]
dev = [
    "marimo>=0.10.4",
    "nba-on-court>=0.2.1",
    "ruff>=0.8.3",
    "wat-inspector>=0.4.3",
]
